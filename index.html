<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nordkapp 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B1120'/><path d='M22 72 L50 24 L78 72' stroke='%234ADE9B' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --night:#0B1120; --surface:#131C2E; --surface-2:#18243A; --line:#22304B;
    --aurora:#4ADE9B; --ice:#7DD3FC; --amber:#F5B942; --rose:#F87171;
    --text:#E8EEF7; --muted:#8194AE;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--night);color:var(--text);font-family:var(--sans)}
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
  button,input,select{font-family:inherit;font-size:16px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0B1120 72%,rgba(11,17,32,0));padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
  .eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{margin:3px 0 0;font-size:26px;letter-spacing:-.02em;font-weight:800;line-height:1.05}
  h1 span{color:var(--aurora)}
  .stats{display:flex;gap:20px;margin-top:12px}
  .stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .bar{height:3px;border-radius:3px;background:var(--line);margin-top:14px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),var(--aurora));transition:width .5s ease}

  main{padding:4px 18px 24px}
  section{display:none;animation:fade .28s ease}
  section.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
  .h2:first-child{margin-top:8px}

  /* route spine */
  .spine{position:relative;padding-left:30px}
  .spine::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,var(--ice),var(--aurora),#2A3B57)}
  .stop{position:relative;padding:11px 0}
  .stop::before{content:"";position:absolute;left:-27px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--night);border:2px solid var(--line)}
  .stop.done::before{background:var(--aurora);border-color:var(--aurora);box-shadow:0 0 0 4px rgba(74,222,155,.15)}
  .stop .t{font-weight:700;font-size:16px}
  .stop.done .t{color:var(--muted);text-decoration:line-through}
  .stop .s{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stop button{all:unset;display:block;width:100%;cursor:pointer}

  /* cards + rows */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .ttl{font-weight:650;font-size:15px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .done .ttl{text-decoration:line-through;color:var(--muted)}
  .chk{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line);background:transparent;cursor:pointer;position:relative}
  .chk.on{background:var(--aurora);border-color:var(--aurora)}
  .chk.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:2px solid #08131f;border-top:0;border-left:0;transform:rotate(42deg)}
  .del{all:unset;cursor:pointer;color:#5B6C86;font-size:20px;padding:0 4px;line-height:1}
  .amt{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ice)}
  .tag.a{color:var(--aurora)}
  .tag.m{color:var(--amber)}

  /* forms */
  .form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  input,select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px 13px;outline:none}
  input:focus,select:focus{border-color:var(--ice)}
  input::placeholder{color:#5B6C86}
  .add{all:unset;cursor:pointer;background:var(--aurora);color:#07131f;font-weight:800;padding:12px 18px;border-radius:11px;text-align:center}
  .w80{flex:0 0 92px}
  button:focus-visible,.chk:focus-visible,.stop button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}

  /* money summary */
  .total{background:linear-gradient(135deg,#1B2740,#131C2E);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
  .total .big{font-size:40px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--amber)}
  .split{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .split b{color:var(--text);font-variant-numeric:tabular-nums}

  .empty{color:var(--muted);font-size:13.5px;padding:14px 0;text-align:center}

  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
      background:rgba(15,22,39,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
      padding:9px 4px calc(9px + env(safe-area-inset-bottom))}
  nav button{all:unset;cursor:pointer;text-align:center;padding:5px 0;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em}
  nav button svg{display:block;margin:0 auto 3px;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--aurora)}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Ahaus → 71°10′ N</div>
  <h1>Nordkapp <span>2026</span></h1>
  <div class="stats">
    <div class="stat"><b id="sEtappen">0/0</b><small>Etappen</small></div>
    <div class="stat"><b id="sHigh">0/0</b><small>Highlights</small></div>
    <div class="stat"><b id="sGeld">0 €</b><small>Ausgaben</small></div>
  </div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
</header>

<main>
  <!-- ROUTE -->
  <section id="v-route" class="on">
    <div class="h2">Route · abhaken, wenn geschafft</div>
    <div class="spine" id="routeList"></div>
    <div class="h2">Eigene Etappe</div>
    <div class="form">
      <input id="rName" placeholder="z. B. Umweg Vesterålen">
      <input id="rSub" class="w80" placeholder="km / Info">
      <button class="add" id="rAdd">Hinzufügen</button>
    </div>
  </section>

  <!-- SUPERCHARGER -->
  <section id="v-charge">
    <div class="h2">Supercharger-Stopps</div>
    <div class="form">
      <input id="cName" placeholder="Ort, z. B. Umeå">
      <input id="cInfo" class="w80" placeholder="kWh / min">
      <button class="add" id="cAdd">Eintragen</button>
    </div>
    <div id="chargeList"></div>
  </section>

  <!-- HIGHLIGHTS -->
  <section id="v-high">
    <div class="h2">Highlights & Wanderungen</div>
    <div class="form">
      <input id="hName" placeholder="Neues Highlight">
      <input id="hSub" class="w80" placeholder="Ort">
      <button class="add" id="hAdd">Hinzufügen</button>
    </div>
    <div id="highList"></div>
  </section>

  <!-- CHECKLISTE -->
  <section id="v-pack">
    <div class="h2">Packliste</div>
    <div class="form">
      <input id="pName" placeholder="Was fehlt noch?">
      <button class="add" id="pAdd">Auf die Liste</button>
    </div>
    <div id="packList"></div>
  </section>

  <!-- AUSGABEN -->
  <section id="v-money">
    <div class="total">
      <div class="eyebrow">Gesamt ausgegeben</div>
      <div class="big" id="mTotal">0,00 €</div>
      <div class="split">
        <span>Pro Person <b id="mHalf">0,00 €</b></span>
        <span>Einträge <b id="mCount">0</b></span>
      </div>
    </div>
    <div class="form">
      <input id="mName" placeholder="Was?">
      <input id="mAmt" class="w80" inputmode="decimal" placeholder="€">
      <select id="mCat">
        <option>Essen</option><option>Maut/Fähre</option><option>Laden</option>
        <option>Camping</option><option>Ausrüstung</option><option>Sonstiges</option>
      </select>
      <button class="add" id="mAdd">Buchen</button>
    </div>
    <div id="moneyList"></div>
  </section>
</main>

<nav>
  <button data-v="route" class="on"><svg viewBox="0 0 24 24"><path d="M9 20l-5.5 2V6L9 4m0 16l6-2M9 20V4m6 14l5.5 2V4L15 6m0 12V6M9 4l6 2"/></svg>Route</button>
  <button data-v="charge"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>Laden</button>
  <button data-v="high"><svg viewBox="0 0 24 24"><path d="M3 19l6-10 4 6 3-4 5 8H3z"/><circle cx="17" cy="6" r="2"/></svg>Ziele</button>
  <button data-v="pack"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4zM9 8V5h6v3"/><path d="M8 13l2.5 2.5L16 11"/></svg>Packen</button>
  <button data-v="money"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 11h18"/><circle cx="17" cy="15" r="1.4"/></svg>Kasse</button>
</nav>

<script>
/* ---------- Speicher: läuft im Claude-Artefakt UND als eigene Datei ---------- */
const KEY = "nordkapp2026";
async function load(){
  try{ if(window.storage){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; } }catch(e){}
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
async function save(){
  const s = JSON.stringify(state);
  try{ if(window.storage){ await window.storage.set(KEY, s, false); return; } }catch(e){}
  try{ localStorage.setItem(KEY, s); }catch(e){}
}

/* ---------- Startdaten aus der Routenplanung ---------- */
const DEFAULT = {
  route:[
    {t:"Ahaus – Abfahrt",s:"Start, Auto voll",d:false},
    {t:"Dänemark / Jütland",s:"Tesla-Service kurz vor der Grenze",d:false},
    {t:"Storebæltbrücke",s:"Maut einplanen",d:false},
    {t:"Öresundbrücke",s:"Übergang nach Schweden",d:false},
    {t:"E4 Richtung Norden",s:"Schweden, Ostküste",d:false},
    {t:"Skuleskogen",s:"Wanderung Slåttdalsskrevan",d:false},
    {t:"Finnland",s:"Durchquerung Lappland",d:false},
    {t:"Nordkapp",s:"71°10′21″ N",d:false},
    {t:"Alta",s:"Rückweg Norwegen",d:false},
    {t:"Tromsø",s:"Fjellheisen",d:false},
    {t:"Lofoten",s:"Reinebringen",d:false},
    {t:"Trondheim",s:"",d:false},
    {t:"Göteborg",s:"",d:false},
    {t:"Ahaus – zurück",s:"~7.000 km",d:false}
  ],
  high:[
    {t:"Slåttdalsskrevan",s:"Skuleskogen NP, Schweden",d:false},
    {t:"Nordkapp-Plateau",s:"Der nördlichste Punkt",d:false},
    {t:"Knivskjellodden",s:"Optional, ~18 km Wanderung",d:false},
    {t:"Fjellheisen",s:"Tromsø",d:false},
    {t:"Reinebringen",s:"Lofoten, 1.566 Stufen",d:false},
    {t:"Drohnenflug",s:"DJI Mini 3 – Regeln in NO beachten",d:false}
  ],
  pack:[
    {t:"Wanderschuhe",d:false},{t:"Gaskocher + Kartuschen",d:false},
    {t:"Schlafsachen fürs Auto",d:false},{t:"DJI Mini 3 + Fernbedienung",d:false},
    {t:"Powerbank & Ladekabel",d:false},{t:"Mückenschutz",d:false},
    {t:"Regenjacke",d:false},{t:"Reisepass / Ausweis",d:false},
    {t:"Bargeld NOK",d:false},{t:"Wasserkanister",d:false}
  ],
  charge:[], money:[]
};

let state = null;

/* ---------- Rendern ---------- */
const $ = id => document.getElementById(id);
const eur = n => n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";

function render(){
  // Route
  $("routeList").innerHTML = state.route.map((r,i)=>`
    <div class="stop ${r.d?"done":""}"><button data-a="route" data-i="${i}">
      <div class="t">${esc(r.t)}</div>${r.s?`<div class="s">${esc(r.s)}</div>`:""}
    </button></div>`).join("");

  // Supercharger
  $("chargeList").innerHTML = state.charge.length ? state.charge.map((c,i)=>`
    <div class="card ${c.d?"done":""}"><div class="row">
      <button class="chk ${c.d?"on":""}" data-a="charge" data-i="${i}" aria-label="Erledigt"></button>
      <div class="grow"><div class="ttl">${esc(c.t)}</div>${c.s?`<div class="sub">${esc(c.s)}</div>`:""}</div>
      <span class="tag a">frei laden</span>
      <button class="del" data-x="charge" data-i="${i}" aria-label="Löschen">×</button>
    </div></div>`).join("")
    : `<div class="empty">Noch kein Stopp eingetragen. Trag den nächsten Supercharger ein, sobald er geplant ist.</div>`;

  // Highlights
  $("highList").innerHTML = state.high.map((h,i)=>`
    <div class="card ${h.d?"done":""}"><div class="row">
      <button class="chk ${h.d?"on":""}" data-a="high" data-i="${i}" aria-label="Erledigt"></button>
      <div class="grow"><div class="ttl">${esc(h.t)}</div>${h.s?`<div class="sub">${esc(h.s)}</div>`:""}</div>
      <button class="del" data-x="high" data-i="${i}" aria-label="Löschen">×</button>
    </div></div>`).join("");

  // Packliste
  $("packList").innerHTML = state.pack.map((p,i)=>`
    <div class="card ${p.d?"done":""}"><div class="row">
      <button class="chk ${p.d?"on":""}" data-a="pack" data-i="${i}" aria-label="Eingepackt"></button>
      <div class="grow"><div class="ttl">${esc(p.t)}</div></div>
      <button class="del" data-x="pack" data-i="${i}" aria-label="Löschen">×</button>
    </div></div>`).join("");

  // Ausgaben
  const sum = state.money.reduce((a,m)=>a+m.a,0);
  $("mTotal").textContent = eur(sum);
  $("mHalf").textContent = eur(sum/2);
  $("mCount").textContent = state.money.length;
  $("moneyList").innerHTML = state.money.length ? state.money.slice().reverse().map(m=>`
    <div class="card"><div class="row">
      <div class="grow"><div class="ttl">${esc(m.t)}</div><div class="sub">${esc(m.c)} · ${esc(m.date)}</div></div>
      <span class="amt">${eur(m.a)}</span>
      <button class="del" data-x="money" data-id="${m.id}" aria-label="Löschen">×</button>
    </div></div>`).join("")
    : `<div class="empty">Noch nichts gebucht. Jeder Einkauf hier rein – am Ende steht die echte Reisekasse.</div>`;

  // Kopfzeile
  const rd = state.route.filter(r=>r.d).length, hd = state.high.filter(h=>h.d).length;
  $("sEtappen").textContent = rd+"/"+state.route.length;
  $("sHigh").textContent = hd+"/"+state.high.length;
  $("sGeld").textContent = Math.round(sum).toLocaleString("de-DE")+" €";
  $("bar").style.width = (rd/state.route.length*100)+"%";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- Interaktion ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-a],[data-x],nav button");
  if(!t) return;
  if(t.dataset.a){ const l=state[t.dataset.a]; l[t.dataset.i].d = !l[t.dataset.i].d; commit(); }
  else if(t.dataset.x==="money"){ state.money = state.money.filter(m=>m.id!=t.dataset.id); commit(); }
  else if(t.dataset.x){ state[t.dataset.x].splice(t.dataset.i,1); commit(); }
  else if(t.dataset.v){
    document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===t));
    document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="v-"+t.dataset.v));
    scrollTo({top:0});
  }
});
function commit(){ render(); save(); }

function hook(btn, fn, ...ins){
  const go = ()=>{ if(fn()) { ins.forEach(i=>$(i).value=""); commit(); } };
  $(btn).addEventListener("click", go);
  ins.forEach(i=>$(i).addEventListener("keydown", e=>{ if(e.key==="Enter") go(); }));
}
hook("rAdd", ()=>{ const v=$("rName").value.trim(); if(!v) return false;
  state.route.push({t:v,s:$("rSub").value.trim(),d:false}); return true; }, "rName","rSub");
hook("cAdd", ()=>{ const v=$("cName").value.trim(); if(!v) return false;
  state.charge.push({t:v,s:$("cInfo").value.trim(),d:false}); return true; }, "cName","cInfo");
hook("hAdd", ()=>{ const v=$("hName").value.trim(); if(!v) return false;
  state.high.push({t:v,s:$("hSub").value.trim(),d:false}); return true; }, "hName","hSub");
hook("pAdd", ()=>{ const v=$("pName").value.trim(); if(!v) return false;
  state.pack.push({t:v,d:false}); return true; }, "pName");
hook("mAdd", ()=>{ const v=$("mName").value.trim();
  const a=parseFloat($("mAmt").value.replace(",",".")); if(!v||isNaN(a)) return false;
  state.money.push({id:Date.now()+"", t:v, a:a, c:$("mCat").value,
    date:new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"short"})}); return true; }, "mName","mAmt");

/* ---------- Start ---------- */
(async()=>{
  const saved = await load();
  state = saved || DEFAULT;
  for(const k in DEFAULT) if(!state[k]) state[k] = DEFAULT[k];
  render();
})();
</script>
</body>
</html>
